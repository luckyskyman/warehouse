<!DOCTYPE html>
<html>
<head>
    <title>API 테스트</title>
</head>
<body>
    <h1>Vercel API 연결 테스트</h1>
    <button onclick="testAuth()">인증 API 테스트</button>
    <button onclick="testInventory()">재고 API 테스트</button>
    <div id="result"></div>
    
    <script>
        async function testAuth() {
            const result = document.getElementById('result');
            try {
                result.innerHTML = '인증 API 호출 중...';
                
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username: 'admin', password: 'password' })
                });
                
                const data = await response.json();
                result.innerHTML = `
                    <h3>인증 API 결과:</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Response:</strong> ${JSON.stringify(data, null, 2)}</p>
                `;
            } catch (error) {
                result.innerHTML = `
                    <h3>인증 API 오류:</h3>
                    <p style="color: red;">${error.message}</p>
                `;
            }
        }
        
        async function testInventory() {
            const result = document.getElementById('result');
            try {
                result.innerHTML = '재고 API 호출 중...';
                
                const response = await fetch('/api/inventory');
                const data = await response.json();
                
                result.innerHTML = `
                    <h3>재고 API 결과:</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Response:</strong> ${JSON.stringify(data, null, 2)}</p>
                `;
            } catch (error) {
                result.innerHTML = `
                    <h3>재고 API 오류:</h3>
                    <p style="color: red;">${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
